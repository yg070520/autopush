plugins {
    id 'com.android.application'
}

// 强制统一 Kotlin stdlib 版本，避免 jdk7/jdk8 变体与主 stdlib 产生重复类冲突
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

android {
    namespace 'top.jatus.ibkr'
    compileSdk 34

    defaultConfig {
        applicationId "top.jatus.ibkr"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"

        // 极光推送 AppKey
        manifestPlaceholders = [
            JPUSH_PKGNAME  : applicationId,
            JPUSH_APPKEY   : "2e4279d8d36497b86bbeb0f9",
            JPUSH_CHANNEL  : "developer-default",
            // 小米厂商通道（在小米开放平台申请后填入）
            XIAOMI_APPID   : "MI-小米的APPID",
            XIAOMI_APPKEY  : "MI-小米的APPKEY",
            // OPPO 厂商通道（在 OPPO 开放平台申请后填入）
            OPPO_APPKEY    : "OP-oppo的APPKEY",
            OPPO_APPID     : "OP-oppo的APPID",
            OPPO_APPSECRET : "OP-oppo的APPSECRET",
            // VIVO 厂商通道（在 VIVO 开放平台申请后填入）
            VIVO_APPKEY    : "vivo的APPKEY",
            VIVO_APPID     : "vivo的APPID"
        ]

        ndk {
            // 指定 ABI，确保 JPush native 库正确加载
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // 从 Gradle 属性（CI 传入）或本地 keystore.properties 读取签名信息
    def keystorePropsFile = rootProject.file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        release {
            storeFile     file(findProperty("STORE_FILE")     ?: keystoreProps["storeFile"]     ?: "release.jks")
            storePassword      (findProperty("STORE_PASSWORD") ?: keystoreProps["storePassword"] ?: "")
            keyAlias           (findProperty("KEY_ALIAS")      ?: keystoreProps["keyAlias"]      ?: "")
            keyPassword        (findProperty("KEY_PASSWORD")   ?: keystoreProps["keyPassword"]   ?: "")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // JPush 的 libjutils.so 不支持 strip，保留原始符号即可
    packaging {
        jniLibs {
            keepDebugSymbols += ['**/libjutils.so']
        }
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // 极光推送 5.5.3（jcore 自动引入，无需单独声明）
    implementation 'cn.jiguang.sdk:jpush:5.5.3'

    // 国内厂商通道（后台保活，国内手机必须接入才能稳定收推送）
    implementation 'cn.jiguang.sdk.plugin:xiaomi:5.5.3'   // 小米
    implementation 'cn.jiguang.sdk.plugin:oppo:5.5.3'     // OPPO
    implementation 'cn.jiguang.sdk.plugin:vivo:5.5.3.a'   // VIVO
}
