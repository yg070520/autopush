name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:     # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 JDK 17（AGP 8.x 要求）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 安装 Gradle（不依赖本地 wrapper jar）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      # 4. 从 Secret 解码 keystore 文件
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      # 5. 构建签名 Release APK
      - name: Build Release APK
        run: |
          gradle assembleRelease \
            -PSTORE_FILE=release.jks \
            -PSTORE_PASSWORD="${{ secrets.STORE_PASSWORD }}" \
            -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      # 6. 重命名 APK（含 commit sha）
      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             dist/jatus-ibkr-${SHORT_SHA}.apk

      # 7. 上传 APK 为 Artifact（Actions 页面可直接下载）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jatus-ibkr-apk
          path: dist/*.apk
          retention-days: 30

      # 8. 推送 Tag 时自动创建 GitHub Release 并附加 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
